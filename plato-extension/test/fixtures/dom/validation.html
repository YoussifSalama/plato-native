<!doctype html><html><body>
<form>
  <label for="short">Name</label><input id="short" type="text" maxlength="5" />
  <label for="ph">Phone</label><input id="ph" type="tel" pattern="[0-9]{3}-[0-9]{4}" />
  <label for="em">Email</label><input id="em" type="email" />
  <label for="mask">LinkedIn</label><input id="mask" type="text" />
  <label for="city">City</label><input id="city" type="text" />
  <button type="submit" id="go">Send</button>
</form>
</body></html>
