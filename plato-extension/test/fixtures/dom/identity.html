<!doctype html><html><body>
<!-- Synthetic page for tests: common identity fields labelled in the usual ways. -->
<form id="apply" action="/submit" method="post">
  <label for="fn">First name *</label><input id="fn" name="fn" type="text" required autocomplete="given-name" />
  <label>Last name <input name="ln" type="text" required /></label>
  <input name="mail" type="email" aria-label="Email address" required />
  <span id="phl">Phone number</span><input name="ph" type="tel" aria-labelledby="phl" />
  <label for="co">Country</label>
  <select id="co" name="co" required>
    <option value="">Select…</option><option value="EG">Egypt</option><option value="US">United States</option><option value="DE" disabled>Germany</option>
  </select>
  <label for="ci">City</label><input id="ci" name="ci" type="text" />
  <label for="li">LinkedIn profile</label><input id="li" name="li" type="text" />
  <fieldset><legend>Are you authorised to work here? *</legend>
    <label><input type="radio" name="auth" value="yes" required /> Yes</label>
    <label><input type="radio" name="auth" value="no" /> No</label>
  </fieldset>
  <label><input type="checkbox" name="terms" required /> I agree to the terms *</label>
  <input type="password" name="pw" aria-label="Password" />
  <input type="hidden" name="csrf" value="x" />
  <button type="submit" id="send">Submit application</button>
</form>
</body></html>
