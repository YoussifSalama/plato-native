<!doctype html><html><body>
<form>
  <label for="t">Name</label><input id="t" type="text" />
  <label id="rl">Role</label>
  <div role="combobox" aria-labelledby="rl" aria-required="true" tabindex="0">Pick a role</div>
  <div role="checkbox" aria-checked="false" aria-label="Subscribe" tabindex="0"></div>
  <div contenteditable="true" role="textbox" aria-label="Bio"></div>
  <input id="ta" role="combobox" aria-autocomplete="list" aria-label="School" />
  <label for="msg">Message *</label><textarea id="msg" required></textarea>
  <label for="dob">Date of birth</label><input id="dob" type="date" />
  <label for="cv">CV</label><input id="cv" type="file" />
  <label for="sk">Skills</label><select id="sk" multiple><option>A</option><option>B</option></select>
  <label for="yr">Years</label><input id="yr" type="number" />
</form>
</body></html>
