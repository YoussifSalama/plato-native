# Plato on one VPS: Mongo (single-node replica set, Prisma needs one), Redis, API, web app, Caddy (the only
# public ports; TLS from Let's Encrypt). Settings and secrets come from ./.env next to this file (deploy/env.example).
# Local smoke test: WEB_DOMAIN=localhost API_DOMAIN=api.localhost -> Caddy serves a self-signed cert.
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: >
      bash -c "[ -f /data/key/keyfile ] || (openssl rand -base64 756 > /data/key/keyfile && chmod 400 /data/key/keyfile && chown mongodb /data/key/keyfile);
      exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/key/keyfile --bind_ip_all"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - mongo-key:/data/key
    healthcheck:
      # initiates the replica set the first time, then reports healthy once it is
      test: ["CMD-SHELL", "mongosh --quiet -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/youssifsalama/plato-api:latest}
    build: ./plato-native-be
    restart: unless-stopped
    env_file:
      - path: .env
        required: false # ${...:?} checks above still fail loudly when it is missing
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      DB_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/plato?authSource=admin&replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: https://${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      API_PUBLIC_URL: https://${API_DOMAIN:?set API_DOMAIN in .env}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/youssifsalama/plato-web:latest}
    build:
      context: ./plato-job-seeker-native-fe
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  mongo-data:
  mongo-key:
  redis-data:
  caddy-data:
  caddy-config:
