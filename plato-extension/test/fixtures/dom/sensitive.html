<!doctype html><html><body>
<form>
  <label for="e">Email</label><input id="e" type="email" />
  <label for="pw">Password</label><input id="pw" type="password" />
  <label for="np">Create a new one</label><input id="np" type="text" autocomplete="new-password" />
  <label for="otp">Verification code</label><input id="otp" type="text" />
  <input id="otp2" type="text" autocomplete="one-time-code" aria-label="Code" />
  <label for="cc">Card number</label><input id="cc" type="text" />
  <input id="ccn" type="text" autocomplete="cc-csc" aria-label="Security" />
  <label for="ssn">Social security number</label><input id="ssn" type="text" />
  <label for="pin">PIN</label><input id="pin" type="text" />
</form>
</body></html>
